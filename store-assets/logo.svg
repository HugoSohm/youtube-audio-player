<!-- Logo YouTube Audio Player : liste + play, dégradé rouge sur fond nuit (style Riptune) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="g1" gradientUnits="userSpaceOnUse" x1="24" y1="30" x2="100" y2="104">
      <stop offset="0%" stop-color="#ff5a52"/><stop offset="100%" stop-color="#ff0000"/></linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="#0a0f1c"/>
  <g transform="translate(2 -3)">

    <rect x="24" y="30" width="58" height="11" rx="5.5" fill="url(#g1)" opacity="1"/>
    <rect x="24" y="52" width="58" height="11" rx="5.5" fill="url(#g1)" opacity="0.85"/>
    <rect x="24" y="74" width="30" height="11" rx="5.5" fill="url(#g1)" opacity="0.7"/>
    <path d="M70 72 L70 100 L96 86 Z" stroke-linejoin="round" fill="url(#g1)" stroke="url(#g1)" stroke-width="9"/>
  </g>
</svg>
